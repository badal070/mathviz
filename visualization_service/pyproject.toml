[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visualization-service"
version = "0.1.0"
description = "MathViz 3D Visualization Service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "msgpack>=1.0",
  "sympy>=1.13",
  "numpy>=1.26",
  "celery>=5.4",
  "pillow>=10.4",
  "imageio>=2.36",
  "imageio-ffmpeg>=0.5",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["visualization_service*"]
