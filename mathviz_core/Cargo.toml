[package]
name = "mathviz_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust computation core for MathViz 3D"

[lib]
name = "mathviz_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["simd"]
simd = []
grpc-fallback = []
dev-logging = []

[dependencies]
hashbrown = "0.15"
nalgebra = "0.34"
ndarray = "0.16"
numpy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "core_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
